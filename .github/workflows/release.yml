name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # The CI workflow is not a gate on this one — a push to `main` runs both
  # side by side — so the same checks run here before anything is versioned
  # or published.
  checks:
    runs-on: ubuntu-latest
    outputs:
      # Whether unreleased changesets exist. With some pending, the run opens
      # or updates the version PR; with none, the run may publish.
      pending: ${{ steps.changesets.outputs.pending }}
      # Whether the version in the tree is still missing from npm. Without this
      # every push to `main` would start the publish job and park it on the
      # environment's approval gate with nothing to publish.
      unpublished: ${{ steps.registry.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Package export checks
        run: pnpm check:exports

      - name: Look for pending changesets
        id: changesets
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      # The three packages version together, so one lookup stands for all.
      - name: Compare the tree's version with npm
        id: registry
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if npm view "@joihouse/magnet-cursor-core@$version" version >/dev/null 2>&1; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          fi

  # Opens (or updates) the "Version Packages" PR. Needs no secret beyond the
  # workflow token, so it runs unattended on every push.
  version:
    needs: checks
    if: needs.checks.outputs.pending == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Not for the action — v2 only reads its input — but for the
          # changelog generator, which `pnpm version-packages` runs as a child
          # process and which looks up PR numbers and authors through this.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes whatever the merged version PR bumped. There is no npm token:
  # each package on npm names this repository, this workflow file and the
  # `npm` environment as its trusted publisher, and `pnpm publish` (11+)
  # exchanges the job's OIDC identity for a short-lived credential through
  # `id-token: write`. The environment carries a required reviewer, so the
  # job waits for a human to approve the deployment first. Provenance is
  # attached automatically for a public repository.
  publish:
    needs: checks
    if: needs.checks.outputs.pending == 'false' && needs.checks.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No `registry-url` here on purpose: it would write an `_authToken`
      # placeholder into .npmrc that nothing fills in.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm release` builds and re-runs the export checks on the packed
      # output right before `changeset publish`.
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
